# 发布到 PyPI：tag v* 触发。
#
# 前置（仓库 owner 手动做一次）：
#   1. 在 PyPI 创建 spiceunion 项目；
#   2. 项目 Settings -> Publishing：把 GitHub 仓库
#      Snappersontheprowl/SPICEUnion（environment: pypi）加为 trusted publisher；
#   3. 打 tag（如 v0.1.0）即触发本 workflow。
name: publish-pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SPICEUnion
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          pip install build cibuildwheel

      - name: Build sdist
        run: python -m build --sdist --outdir dist

      - name: Build manylinux wheels (cp39-cp312 x86_64)
        run: python -m cibuildwheel --output-dir dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release
        with:
          packages-dir: dist
